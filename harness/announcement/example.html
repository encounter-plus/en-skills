<style>
.synthetic-announcement{max-width:600px;margin:auto;padding:24px;border:1px solid #5ed136;border-radius:16px;text-align:left}
.synthetic-announcement h3{font-size:26px}
.synthetic-announcement button{margin-top:16px;padding:12px 18px;border-radius:8px;background:#5ed136;color:#11200d;min-height:44px}
.synthetic-announcement output{display:block;margin-top:16px}
@media(max-width:480px){.synthetic-announcement{padding:16px}.synthetic-announcement h3{font-size:22px}}
</style>
<section class="synthetic-announcement"><h3>Ночь загадок</h3><p>Пример анонса: узнайте, что взять с собой.</p>
<button type="button" id="show-kit" aria-expanded="false">Что взять?</button>
<output id="kit-result" aria-live="polite">Нажмите кнопку</output></section>
<script>
document.querySelector('#show-kit').addEventListener('click',()=>{
 document.querySelector('#kit-result').textContent='Фонарик и удобная обувь';
 document.querySelector('#show-kit').setAttribute('aria-expanded','true');
});
</script>
