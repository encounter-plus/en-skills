name: Скилл ведёт себя неверно
description: Ассистент неверно понял задачу, нарушил правило или выдал неподходящий результат.
title: "[Скилл] "
body:
  - type: markdown
    attributes:
      value: |
        Можете использовать синтетические данные или реальные данные создания игры, если можете ими поделиться. Не публикуйте токены и данные, которые нельзя раскрывать.
        Если команда не запускается или установка завершается ошибкой, выберите форму «Ошибка инструмента или установки».
  - type: input
    id: skill
    attributes:
      label: Какой скилл использовали?
      placeholder: "Например: game-author. Если неизвестно, так и напишите."
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Что вы попросили сделать?
      description: Приведите запрос и минимальные входные данные. Укажите важные предыдущие уточнения.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что сделал ассистент?
      description: Приведите короткий фрагмент ответа или опишите действие. Если повторяли запрос, укажите, повторилась ли проблема.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Какого результата вы ожидали?
      description: Если известно нарушенное правило, укажите его название или раздел справочника.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Приложение, модель и версия скиллов
      description: Укажите то, что известно. Версию можно заменить датой установки или обновления.
      placeholder: "Приложение / модель / версия или дата обновления"
