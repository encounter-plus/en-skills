name: Предложить новый скилл
description: Предложить отдельный рабочий процесс для авторов игр Encounter.
title: "[Новый скилл] "
body:
  - type: markdown
    attributes:
      value: |
        Опишите задачу пользователя — готовый SKILL.md или техническая реализация не нужны.
        Можете использовать синтетические данные или реальные данные создания игры, если можете ими поделиться.
  - type: textarea
    id: need
    attributes:
      label: Кому и в какой ситуации нужен скилл?
      description: Какую задачу он должен помогать решать?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Пример запроса и ожидаемый результат
      description: Что пользователь напишет ассистенту, какие материалы предоставит и что получит в итоге?
    validations:
      required: true
  - type: textarea
    id: existing
    attributes:
      label: Чем не подходят существующие скиллы?
      description: Если пробовали существующий скилл, расскажите, чего не хватило. Возможно, задачу удобнее решить его расширением.
  - type: textarea
    id: dependencies
    attributes:
      label: Какие инструменты или данные могут понадобиться?
      description: Например, только текст, фотографии, таблицы или доступ к движку. Если не знаете, оставьте поле пустым; доступы и секреты здесь не нужны.
