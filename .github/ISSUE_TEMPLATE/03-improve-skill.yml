name: Улучшить скилл или документацию
description: Дополнить существующий процесс, уточнить правило или исправить непонятную инструкцию.
title: "[Улучшение] "
body:
  - type: markdown
    attributes:
      value: |
        Эта форма подходит для улучшения существующих скиллов, справочников и инструкций.
        Можете использовать синтетические данные или реальные данные создания игры, если можете ими поделиться.
  - type: input
    id: area
    attributes:
      label: Что нужно улучшить?
      description: Название скилла, документа или раздела. Можно описать своими словами.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: В какой ситуации возникает затруднение?
      description: Какую задачу вы решаете и чего сейчас не хватает или что непонятно?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Какое изменение поможет?
      description: Опишите желаемое поведение или предложите новую формулировку. Техническое решение не требуется.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Пример или обоснование
      description: При необходимости добавьте пример «сейчас → хотелось бы» или общедоступный источник правила.
